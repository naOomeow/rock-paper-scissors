<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <div id="mainBox">
        <h3>Rock Paper Scissors</h3>
        <div id="inside-box">
            <div id="display">
                <div id="display-score">
                    <div class="score"><h2 id="computer">Computer</h2></div>
                    <div class="score"><h2 id="human">Human</h2></div>
                </div>
            </div>

            <div id="display-choice">
                <h5 id="choice">Start Game!</h5>
            </div>

            <div id="buttons-box">
                <div id="start-button">
                    <button class="buttons-style">Start</button>
                </div>
            </div>
        </div>    
    </div>

    <footer >naOomeow</footer>
    

    <script src="main.js"></script>
</body>
</html>
